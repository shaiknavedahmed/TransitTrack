version: '3.8'

services:
  metro-transit-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metro_transit_app
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
