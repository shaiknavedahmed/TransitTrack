services:
  tgsrtc-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgsrtc_portal_app
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
