apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgsrtc-portal
  labels:
    app: tgsrtc-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tgsrtc-portal
  template:
    metadata:
      labels:
        app: tgsrtc-portal
    spec:
      containers:
        - name: tgsrtc-portal
          image: ghcr.io/shaiknavedahmed/transittrack:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
